<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сверка банковских поступлений</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
</head>
<body>
  <main class="container narrow">
    <header>
      <p class="eyebrow">Финансовый контроль</p>
      <h1>Сверка банковских поступлений</h1>
      <p class="lead">Загрузите выписку банка и реестр счетов. Сервис покажет распределение до копейки и не скроет неоднозначные операции.</p>
    </header>

    {% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}

    <form class="upload-card" action="/reconcile" method="post" enctype="multipart/form-data">
      <label>
        <span>Банковская выписка</span>
        <small>CSV из клиент-банка</small>
        <input type="file" name="statement_file" accept=".csv" required>
      </label>
      <label>
        <span>Реестр счетов</span>
        <small>Файл Excel</small>
        <input type="file" name="invoices_file" accept=".xlsx" required>
      </label>
      <button type="submit">Запустить сверку</button>
    </form>
  </main>
</body>
</html>
